name: build-demos

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-demos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build all demos
        run: |
          set -euo pipefail
          for manifest in demos/*/Cargo.toml; do
            cargo build --manifest-path "$manifest"
          done
